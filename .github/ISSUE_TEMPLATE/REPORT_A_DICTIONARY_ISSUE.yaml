name: Report a Dictionary Issue
description: Correct an entry or propose an attested expression.
labels:
  - dictionary
  - 'type: bug'
assignees:
  - nikkeyl

body:
  - type: textarea
    id: entry
    attributes:
      label: Entry or expression
      description:
        Include the entry ID, spelling, reading, and intended meaning.
    validations:
      required: true
  - type: textarea
    id: correction
    attributes:
      label: Suggested correction
      description:
        Explain the register and context; include an example if useful.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Supporting sources
      description:
        Link evidence for this sense. For copied text, include the author
        and license.
    validations:
      required: true

  - type: checkboxes
    id: terms
    attributes:
      label: Contribution guidelines
      options:
        - label:
            I have read the [contribution
            guidelines](https://github.com/nikkeyl/jeosif/blob/main/CONTRIBUTING.md).
          required: true
