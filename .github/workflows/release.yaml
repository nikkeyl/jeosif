name: Release

on:
  workflow_run:
    workflows:
      - Check
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  release:
    name: Release

    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name ==
      github.repository }}

    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write

    env:
      COMMIT: ${{ github.event.workflow_run.head_sha }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Set Up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24

      - name: Build and Check Release
        run: |
          VERSION="JEOSIF-${COMMIT::7}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

          node .github/scripts/build.mjs --revision "$VERSION"
          node .github/scripts/check.mjs dist/JEOSIF.zip

          cd dist
          sha256sum --check JEOSIF.zip.sha256

      - name: Publish Release
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists."
            exit 0
          fi

          gh release create "$VERSION" dist/JEOSIF.zip dist/JEOSIF.zip.sha256 \
            --target "$COMMIT" --title "$VERSION" --generate-notes
