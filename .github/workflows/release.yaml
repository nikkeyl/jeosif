name: Release

on:
  workflow_run:
    workflows:
      - Check
    types:
      - completed
    branches:
      - main

permissions:
  actions: read
  contents: read

concurrency:
  group: release-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  release:
    name: Release

    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name ==
      github.repository }}

    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      actions: read
      contents: write

    env:
      COMMIT: ${{ github.event.workflow_run.head_sha }}
      CHECK_RUN: ${{ github.event.workflow_run.id }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Download Checked Dictionary
        run: |
          VERSION="JEOSIF-${COMMIT::7}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

          gh run download "$CHECK_RUN" --name "JEOSIF-$COMMIT" --dir dist

          cd dist
          sha256sum --check JEOSIF.zip.sha256
          unzip -t JEOSIF.zip
          unzip -p JEOSIF.zip index.json | cmp - index.json

      - name: Publish Release
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            if [ "$(gh release view "$VERSION" --json isDraft --jq .isDraft)" = false ]; then
              echo "Release $VERSION already exists."
              exit 0
            fi

            gh release upload "$VERSION" dist/JEOSIF.zip dist/JEOSIF.zip.sha256 dist/index.json --clobber
          else
            gh release create "$VERSION" dist/JEOSIF.zip dist/JEOSIF.zip.sha256 dist/index.json \
              --target "$COMMIT" --title "$VERSION" --generate-notes --draft
          fi

          LATEST=false
          if [ "$(gh api "repos/$GH_REPO/commits/main" --jq .sha)" = "$COMMIT" ]; then
            LATEST=true
          fi

          gh release edit "$VERSION" --draft=false --latest="$LATEST"
