name: Release

on:
  workflow_run:
    workflows:
      - Check
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  release:
    name: Release

    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name ==
      github.repository }}

    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write

    env:
      COMMIT: ${{ github.event.workflow_run.head_sha }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Set Up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24

      - name: Install Dependencies
        run: npm ci --prefix .github --ignore-scripts

      - name: Build and Check Release
        run: |
          VERSION="JEOSIF-${COMMIT::7}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

          node .github/scripts/build.mjs --revision "$GITHUB_RUN_NUMBER" --release "$VERSION"
          node .github/scripts/check.mjs dist/JEOSIF.zip

          cd dist
          sha256sum --check JEOSIF.zip.sha256

      - name: Publish Release
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            if [ "$(gh release view "$VERSION" --json isDraft --jq .isDraft)" = false ]; then
              echo "Release $VERSION already exists."
              exit 0
            fi

            gh release upload "$VERSION" dist/JEOSIF.zip dist/JEOSIF.zip.sha256 dist/index.json --clobber
          else
            gh release create "$VERSION" dist/JEOSIF.zip dist/JEOSIF.zip.sha256 dist/index.json \
              --target "$COMMIT" --title "$VERSION" --generate-notes --draft
          fi

          LATEST=false
          if [ "$(gh api "repos/$GH_REPO/commits/main" --jq .sha)" = "$COMMIT" ]; then
            LATEST=true
          fi

          gh release edit "$VERSION" --draft=false --latest="$LATEST"
