name: Check

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check

    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set Up Schema Validation
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/jeosif"
          mkdir -p "$work/tools" "$work/schemas"
          version=17.2.1
          curl --fail --location --silent --show-error --retry 3 \
            "https://github.com/sourcemeta/jsonschema/releases/download/v$version/jsonschema-$version-linux-x86_64.zip" \
            --output "$work/tools/validator.zip"
          printf '%s  %s\n' \
            9ffee3cfbe0fe1343d9d36bcce9e6036ec4d73e4b29f656c039fca6118da2f35 \
            "$work/tools/validator.zip" | sha256sum --check -
          unzip -p "$work/tools/validator.zip" '*/bin/jsonschema' > "$work/tools/jsonschema"
          chmod +x "$work/tools/jsonschema"
          "$work/tools/jsonschema" version

          schema_commit=ee81f8dcf13e985bb4d7961009fb49a764b4d924
          while read -r name digest; do
            curl --fail --location --silent --show-error --retry 3 \
              "https://raw.githubusercontent.com/yomidevs/yomitan/$schema_commit/ext/data/schemas/$name" \
              --output "$work/schemas/$name"
            printf '%s  %s\n' "$digest" "$work/schemas/$name" | sha256sum --check -
          done <<'SCHEMAS'
          dictionary-index-schema.json dde43ca9ef1580ab638f49bb13bd7d5c55646afd655ff99cf429492598feb69b
          dictionary-tag-bank-v3-schema.json 4f537818b3d4be4c40f92c991578f74d73f2239002b608eb10169ab1d63aee0b
          dictionary-term-bank-v3-schema.json 665904fcaac715a018a7df6b49d3ace08390d614a9da4f62222bce32c8030b87
          dictionary-term-meta-bank-v3-schema.json 7236ea5627731175c9cb3b2d22785598ae005be050e538f8fa331a6d27262369
          SCHEMAS

      - name: Build and Check Dictionary
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/jeosif"
          validator="$work/tools/jsonschema"

          RENDER=$(cat <<'JQ'
          def stable_unique:
            reduce .[] as $value ([]; if index($value) == null then . + [$value] else . end);
          def node($tag; $content): {tag: $tag, content: $content};
          def marked($tag; $role; $content): node($tag; $content) + {data: {content: $role}};
          def marker($text): marked("span"; "format-marker"; $text);
          def example_nodes($text; $head):
            if (["しちゃう", "読んじゃった", "ちまう", "じゃう"] | index($head)) == null then $text
            else
              {"宿題":"しゅくだい", "全部":"ぜんぶ", "同じ":"おなじ", "最後":"さいご",
               "友達":"ともだち", "日記":"にっき", "残り":"のこり", "大事":"だいじ",
               "手紙":"てがみ", "約束":"やくそく", "先":"さき", "食":"た", "飲":"の",
               "読":"よ", "破":"やぶ", "忘":"わす"} as $readings |
              ($readings | keys_unsorted | sort_by(-length) | join("|")) as $pattern |
              (reduce ($text | match($pattern; "g")) as $match
                ({position:0, parts:[]};
                 .parts += (if $match.offset > .position then [$text[.position:$match.offset]] else [] end)
                   + [node("ruby"; [$match.string, node("rt"; $readings[$match.string])])] |
                 .position = ($match.offset + $match.length))) |
              .parts + (if .position < ($text|length) then [$text[.position:]] else [] end)
            end;
          def comparison($r; $v):
            $r.full != null and $r.full != "" and $r.full_form_status != "word_formation_base" and $r.full != $v.form;
          def origin($r; $v):
            if $r.full == null or $r.full == "" then null
            elif $v.form == $r.full then
              ([$r.variants[].form | select(. != $r.full)] | stable_unique) as $forms |
              if ($forms|length) > 0 then "Коротко: " + ($forms|join(" / ")) else null end
            elif (["しちゃう", "読んじゃった", "ちまう", "じゃう"]|index($r.headword)) != null then "Стяжение " + $r.full
            elif $r.full_form_status == "word_formation_base" then "Образовано от: " + $r.full
            elif $r.full_form_status == "standard_counterpart" then "Стандартная форма: " + $r.full
            else "Сокращение: " + $r.full end;
          def notes($r; $v):
            if $r.full_form_status == "not_applicable" and $r.full == null then
              ["Самостоятельное сленговое " + (if $r.headword == "それな" then "выражение" else "слово" end) + "; полной формы нет."]
            elif ($r.kolobok_evidence.note // "") != "" and (["ちゃう", "じゃう"]|index($v.form)) != null then [$r.kolobok_evidence.note]
            elif comparison($r; $v) then [($r.formation_patterns // [])[] | select(contains($v.form))]
            elif $r.full == $v.form then []
            else origin($r; $v) as $note | if $note == null then [] else [$note] end end;
          def usage($r; $v):
            if $r.id != 1 then $r.context
            elif $v.form == $r.full then "Вежливая благодарность; подходит для официального общения."
            elif $v.form == "ありがとう" then "Обычная благодарность близким и знакомым; без вежливого окончания."
            else "Очень неформальная благодарность в непринуждённой компании. Не подходит для официального общения." end;
          def example($r; $v; $original):
            ($original |
              if $r.id == 1 then . + {example: ("手伝ってくれて、" + $v.form + "。"), example_ru: "Спасибо, что помог."} else . end |
              if $r.headword == "ちまう" and $v.form == "ちゃう" and (.meaning|contains("непреднамеренно") or contains("ненамеренно")) then
                . + {example:"約束を忘れちゃった。", example_ru:"Позабыл об обещании."} else . end |
              if $r.headword == "ちまう" and $v.form == "ちまう" and (.meaning|contains("завершить")) then
                . + {example:"先に食べちまうぞ。", example_ru:"Я сейчас всё съем."} else . end) as $sense |
            if $sense.example_node != null and $sense.example_node != false then [$sense, $sense.example_node]
            else ($sense.example // "") as $jp |
              (if ($jp|contains($v.form)|not) and ($v.form|endswith("う")) then $v.form[0:-1] + "った" else $v.form end) as $needle |
              (if $needle != "" and ($jp|contains($needle)) then ($jp|split($needle)[0]|length) else null end) as $position |
              [$sense, (if $position == null then example_nodes($jp; $r.headword)
                else [example_nodes($jp[0:$position]; $r.headword),
                  marked("span"; "example-keyword"; example_nodes($needle; $r.headword)),
                  example_nodes($jp[($position + ($needle|length)):]; $r.headword)] end)]
            end;
          def marked_keywords:
            if type == "array" then map(marked_keywords)
            elif type != "object" then .
            else .content = ((.content // "") | marked_keywords) |
              if .data.content == "example-keyword" then .content = [marker("<g>"), .content, marker("</g>")] else . end end;
          def render($r; $v):
            [($r.senses | to_entries[]) as $item |
              marked("div"; "sense"; [marked("span"; "sense-number"; (($item.key + 1|tostring) + ". ")),
                (node("span"; $item.value.meaning) + {lang:"ru"})]),
              (if $item.key == 0 then
                (if comparison($r; $v) then ["※ " + $r.full + " → " + $v.form] else [] end) as $comp |
                ($comp + [notes($r; $v)[] as $note | select(($comp|index("※ " + $note)) == null) | "※ " + $note])[] |
                marked("div"; "sense-note"; [marker("※ "), node("span"; .[2:])])
               else empty end),
              (example($r; $v; $item.value) as [$sense, $jp] |
                if ($sense.example // "") != "" then
                  marked("div"; "example-sentence"; [
                    (marked("span"; "example-sentence-a"; ($jp|marked_keywords)) + {lang:"ja"}),
                    marker(" ∥ "), (marked("span"; "example-sentence-b"; $sense.example_ru) + {lang:"ru"})])
                else empty end)] as $content |
            {type:"structured-content", content:marked("div"; "jeosif-article";
              $content + [marked("div"; "sense-note"; [marker("※ "), node("span"; usage($r; $v))])])};
          def indexed_forms($r):
            (if $r.full != null and $r.full != "" and $r.full_form_status != "word_formation_base"
             then [{form:$r.full, reading:$r.reading}] else [] end) + $r.variants;
          reduce (.entries[] as $r | indexed_forms($r)[] as $v |
              $r.search_metadata[$v.form] as $meta |
              ([$v.form, $v.reading] | stable_unique)[] as $expression |
              {key:([$expression, $v.reading]|tojson), family:$r.id,
               term:[$expression, $v.reading, ($meta.tags|join(" ")), $meta.rules, 0,
                 [render($r; $v + {form:$expression})], -1, $meta.priority]}) as $item
            ({order:[], terms:{}, families:{}};
             $item.key as $key |
             if .terms[$key] == null then
               .order += [$key] | .terms[$key] = $item.term | .families[$key] = [$item.family]
             elif (.families[$key]|index($item.family)) == null then
               .terms[$key][5] += $item.term[5] | .families[$key] += [$item.family]
             else . end) |
          [.order[] as $key | .terms[$key]]
          JQ
          )

          VALIDATE=$(cat <<'JQ'
          . as $source |
          ($tags[0] | map(.[0])) as $known_tags |
          .title == "JEOSIF" and .license == "CC BY-SA 4.0" and
          (.entries | length > 0) and
          ([.entries[].id] | length == (unique|length)) and
          all(.entries[]; . as $row |
            (.id | type == "number" and floor == .) and
            (.sources | length > 0) and all(.sources[]; . as $key | $source.sources | has($key)) and
            (.senses | length > 0) and (.variants | length > 0) and
            (.full_form_status != "not_applicable" or .full == null) and
            all(.senses[];
              (.meaning | type == "string" and test("\\S")) and
              (((.example // "") != "") == ((.example_ru // "") != ""))) and
            all(((if .full != null and .full != "" and .full_form_status != "word_formation_base"
                  then [{form:.full, reading:.reading}] else [] end) + .variants)[];
              (.form|type == "string" and length > 0) and (.reading|type == "string" and length > 0) and
              $row.search_metadata[.form] as $meta |
              all($meta.tags[]; . as $tag | $known_tags | index($tag) != null) and
              (["", "v5u"] | index($meta.rules) != null))) and
          all(.sources[]; .url | type == "string" and test("^https?://"))
          JQ
          )

          VERIFY=$(cat <<'JQ'
          def text:
            if type == "string" then .
            elif type == "array" then map(text) | join("")
            elif type == "object" then (.content // "") | text
            else "" end;
          def key: .[0:2] | tojson;
          $terms[0] as $terms | $source[0] as $source |
          ($terms | map(key)) as $keys |
          ($terms|length > 0) and ($keys|length == (unique|length)) and
          all($terms[]; length == 8 and (.[0]|length > 0) and (.[1]|length > 0) and
            (.[5]|length > 0) and all(.[5][]; .type == "structured-content" and (text|test("\\S")))) and
          all($source.entries[]; . as $row |
            all(.variants[]; [ .form, .reading ] | tojson | . as $key | $keys | index($key) != null) and
            (if .full_form_status == "not_applicable" then
              any($terms[]; .[0] == $row.headword and (.[5]|text|contains("полной формы нет")))
             else true end)) and
          all(["ちゃう", "じゃう", "ちまう", "しちゃう"][];
            . as $word | any($terms[]; .[0] == $word and .[3] == "v5u")) and
          ([$source.pronunciations[]|[.expression,.reading]|tojson] | length == (unique|length)) and
          all($source.pronunciations[];
            . as $pitch | ([.expression,.reading]|tojson) as $key |
            (.reading | explode | to_entries |
              map(select(.key == 0 or (([.value]|implode) as $char | "ゃゅょぁぃぅぇぉゎャュョァィゥェォヮ"|contains($char)|not))) |
              length) as $morae |
            ($keys|index($key) != null) and .source == "kanjium" and
            (.positions|length > 0) and all(.positions[]; type == "number" and floor == . and . >= 0 and . <= $morae))
          JQ
          )

          validate_source() {
            jq -e --slurpfile tags data/tag_bank_1.json "$VALIDATE" "$1" >/dev/null
          }

          build() {
            local output="$1" revision="$2" release="$3"
            local stage name family_count term_count
            stage=$(mktemp -d "$work/build.XXXXXX")
            mkdir -p "$output"
            validate_source data/dictionary.json
            jq "$RENDER" data/dictionary.json > "$stage/term_bank_1.json"
            jq -e -n --slurpfile terms "$stage/term_bank_1.json" \
              --slurpfile source data/dictionary.json "$VERIFY" >/dev/null
            jq '[.pronunciations[] | [.expression, "pitch", {reading, pitches:[.positions[] | {position:.}]}]]' \
              data/dictionary.json > "$stage/term_meta_bank_1.json"
            family_count=$(jq '.entries|length' data/dictionary.json)
            term_count=$(jq 'length' "$stage/term_bank_1.json")
            [[ "$revision" =~ ^[0-9]+$ && "$release" =~ ^JEOSIF-[0-9a-f]{7,40}$ ]]
            jq --arg revision "$revision" --arg release "$release" \
              --arg description "$family_count families; $term_count search records. Japanese contractions, colloquial forms and slang with Russian explanations." \
              '.revision=$revision | .description=$description | .url="https://github.com/nikkeyl/jeosif" |
               .downloadUrl=(.url + "/releases/download/" + $release + "/JEOSIF.zip")' \
              data/index.json > "$stage/index.json"
            cp data/tag_bank_1.json "$stage/tag_bank_1.json"
            cp data/dictionary.json "$stage/SOURCES.json"
            cp data/styles.css "$stage/styles.css"
            jq '.pronunciation_audit' data/dictionary.json > "$stage/pronunciation-audit.json"
            cp licenses/* ATTRIBUTION.md LICENSE DATA-LICENSE.md "$stage/"
            printf 'JEOSIF %s\n%s families; %s search records.\n\n' "$revision" "$family_count" "$term_count" > "$stage/README.txt"
            cat >> "$stage/README.txt" <<'IMPORT'
          Import JEOSIF.zip using the dictionary import screen in Yomitan or Naminori.
          Audio comes from the client; this archive contains no recordings.
          A missing pitch accent is unknown, not necessarily accent [0].
          This AI-assisted collection still needs linguistic review.

          See ATTRIBUTION.md and DATA-LICENSE.md for credits and reuse terms.
          Source and corrections: https://github.com/nikkeyl/jeosif
          IMPORT
            for name in index term-bank term-meta-bank tag-bank; do
              case "$name" in
                index) schema=dictionary-index-schema.json; file=index.json ;;
                term-bank) schema=dictionary-term-bank-v3-schema.json; file=term_bank_1.json ;;
                term-meta-bank) schema=dictionary-term-meta-bank-v3-schema.json; file=term_meta_bank_1.json ;;
                tag-bank) schema=dictionary-tag-bank-v3-schema.json; file=tag_bank_1.json ;;
              esac
              "$validator" validate "$work/schemas/$schema" "$stage/$file"
            done
            jq -e --arg release "$release" --arg revision "$revision" '
              .title == "JEOSIF" and .format == 3 and .sourceLanguage == "ja" and .targetLanguage == "ru" and
              .isUpdatable == true and .revision == $revision and
              .indexUrl == "https://github.com/nikkeyl/jeosif/releases/latest/download/index.json" and
              .downloadUrl == ("https://github.com/nikkeyl/jeosif/releases/download/" + $release + "/JEOSIF.zip")' \
              "$stage/index.json" >/dev/null
            grep -q 'format-marker' "$stage/styles.css"
            chmod 644 "$stage"/*
            TZ=UTC touch -t 198001010000.00 "$stage"/*
            local files=()
            while IFS= read -r name; do files+=("$name"); done < <(cd "$stage"; printf '%s\n' * | LC_ALL=C sort)
            rm -f "$output/JEOSIF.zip"
            (cd "$stage"; TZ=UTC zip -X -q -9 "$output/JEOSIF.zip" "${files[@]}")
            cp "$stage/index.json" "$output/index.json"
            (cd "$output"; sha256sum JEOSIF.zip > JEOSIF.zip.sha256)
            unzip -t "$output/JEOSIF.zip" >/dev/null
            if unzip -Z1 "$output/JEOSIF.zip" | grep -Eq '[/\\]'; then
              echo 'Unexpected path inside dictionary ZIP' >&2
              return 1
            fi
            unzip -p "$output/JEOSIF.zip" index.json | cmp - "$output/index.json"
            echo "PASS: $family_count families, $term_count unique search records, sources, pitch accents and official schemas"
            rm -rf "$stage"
          }

          # Guard the source contract against invalid contributions.
          for mutation in '.entries += [.entries[0]]' '.entries[0].sources=["missing-source"]' '.entries[0].senses[0].meaning=""'; do
            jq "$mutation" data/dictionary.json > "$work/invalid-source.json"
            if validate_source "$work/invalid-source.json" 2>/dev/null; then
              echo 'Invalid source was accepted' >&2
              exit 1
            fi
          done

          # Repeated builds must be byte-identical for the same version and release.
          build "$work/first" 1 JEOSIF-1111111
          build "$work/second" 1 JEOSIF-1111111
          cmp "$work/first/JEOSIF.zip" "$work/second/JEOSIF.zip"

          jq 'del(.indexUrl)' "$work/first/index.json" > "$work/invalid-index.json"
          "$validator" validate "$work/schemas/dictionary-index-schema.json" "$work/invalid-index.json" --invalid
          printf '%s\n' '[["word","reading","","",0,[{"type":"structured-content","content":{"tag":"script","content":"invalid"}}],-1,""]]' \
            > "$work/invalid-terms.json"
          "$validator" validate "$work/schemas/dictionary-term-bank-v3-schema.json" "$work/invalid-terms.json" --invalid
          build "$work/second" 2 JEOSIF-2222222
          jq -e -n --slurpfile previous "$work/first/index.json" --slurpfile next "$work/second/index.json" '
            ($next[0].revision|tonumber) > ($previous[0].revision|tonumber) and
            $next[0].indexUrl == $previous[0].indexUrl and
            ($next[0].downloadUrl|contains("/JEOSIF-2222222/"))' >/dev/null

          revision=0
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then revision="$GITHUB_RUN_NUMBER"; fi
          build "$GITHUB_WORKSPACE/dist" "$revision" "JEOSIF-${GITHUB_SHA::7}"
          echo 'PASS: rejected invalid input and structured content; reproducible ZIP; increasing update revisions'

      - name: Upload Dictionary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: JEOSIF-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7
