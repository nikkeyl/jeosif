name: Check

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check

    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Set Up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24

      - name: Install Dependencies
        run: npm ci --prefix .github --ignore-scripts

      - name: Check Sources and Reproducibility
        run: node .github/scripts/check.mjs

      - name: Build Dictionary
        run: node .github/scripts/build.mjs

      - name: Check Distributable
        run: node .github/scripts/check.mjs dist/JEOSIF.zip

      - name: Upload Dictionary
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: JEOSIF-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7
